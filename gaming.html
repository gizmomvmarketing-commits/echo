<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizmo Shop - Gaming PCs</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Accent variables for Gaming Page */
        :root {
            --accent-color: #f97316; /* Premium Vibrant Orange */
        }
        
        /* 1. Turn both Category Titles and Key Specs headers ORANGE */
        .tier-title,
        #tiered-container .specs-header-title {
            color: #f97316 !important;
            border-left-color: #f97316 !important;
        }
        
        /* 2. Turn Small Card Tags ORANGE */
        #tiered-container .brand-label {
            color: #f97316 !important;
        }
        
        /* 3. FORCE the price tags to stay RED universally */
        #tiered-container .computer-price-block div, 
        #tiered-container .computer-price-block span {
            color: #e94560 !important;
        }
        
        /* Keep modal badge orange for gaming pop-ups */
        .modal-tier-badge { 
            color: #f97316 !important; 
        }

        /* Slider Styles */
        .custom-range-slider {
            position: absolute;
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            z-index: 3;
            height: 6px;
            top: 0;
            left: 0;
            margin: 0;
        }
        .custom-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-top: -7px;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>
  
    <button id="fab-trigger" onclick="toggleControlPanel()" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; padding: 15px; border-radius: 50%; background: #e94560; color: #fff; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);">
        ⚙️
    </button>

    <div id="control-panel" style="display: none; position: fixed; bottom: 90px; right: 30px; z-index: 9998; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 300px; border: 1px solid #e2e8f0;">
        <label style="font-weight: 800; display: block; margin-bottom: 5px;">Max Price (MVR <span id="max-price-display">100,000</span>)</label>
        <div class="slider-track-container" style="position: relative; height: 6px; background: #cbd5e1; border-radius: 5px; margin-bottom: 25px;">
            <div id="slider-track-fill" style="position: absolute; height: 100%; background: #e94560; z-index: 1; border-radius: 5px; left: 0; width: 100%;"></div>
            <input type="range" id="max-price-slider" min="0" max="100000" value="100000" step="1000" oninput="applyFilters()" class="custom-range-slider">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="margin-right:10px;"><input type="checkbox" id="cpu-intel" onchange="applyFilters()" checked> Intel</label>
            <label><input type="checkbox" id="cpu-amd" onchange="applyFilters()" checked> AMD / Ryzen</label>
        </div>

        <button onclick="takeLongScreenshot(event)" style="width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer;">
            📸 Download Screenshot
        </button>
    </div>    

    <main id="tiered-container" style="padding-top: 20px;"></main>

    <div id="product-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal(event)">&times;</button>
            <div class="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="loader.js"></script>
    
    <script>
        loadTieredComputers("gaming");

        function toggleControlPanel() {
            const panel = document.getElementById('control-panel');
            const trigger = document.getElementById('fab-trigger');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
            trigger.innerText = (panel.style.display === 'block') ? '✖️' : '⚙️';
        }

        function takeLongScreenshot(event) {
            const element = document.getElementById('tiered-container') || document.body;
            const btn = event ? event.target : null;
            const originalText = btn ? btn.innerText : '';
            if (btn) btn.innerText = "📸 Snapping...";

            html2canvas(element, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Gizmo-Gaming-Screenshot.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                if (btn) btn.innerText = originalText;
            });
        }
    </script>
</body>
</html>
