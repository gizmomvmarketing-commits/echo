    :root {
        --accent-color: #06b6d4; /* Premium Cyan / Teal */

    /* 1. Turn both Category Titles and Key Specs headers CYAN */
    .tier-title,
    #tiered-container .specs-header-title {
        color: #06b6d4 !important;

    }
    
    /* 2. Turn Small Card Tags CYAN */
    #tiered-container .brand-label {

    }
    
    /* 3. FORCE the price tags to stay RED universally */
    #tiered-container .computer-price-block div, 
    #tiered-container .computer-price-block span {
        color: #e94560 !important;
    }
    
    /* Keep modal badge cyan for monitor pop-ups */

    }
</style>
